<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<title>我们家</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#f7f3ec;
    --card:#fffdf9;
    --ink:#3a3733;
    --ink2:#8a837a;
    --line:#e8e1d5;
    --accent:#4a6b5d;
    --accent-soft:#eaf0ec;
    --warm:#b5785f;
  }
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    line-height:1.65;
    padding:calc(env(safe-area-inset-top) + 16px) 18px calc(env(safe-area-inset-bottom) + 32px);
    max-width:620px;
    margin:0 auto;
  }

  header{padding:8px 2px 22px}
  .sig{font-size:11px;letter-spacing:.32em;color:var(--ink2);text-transform:uppercase}
  h1{font-size:26px;font-weight:600;letter-spacing:.02em;margin-top:6px}
  h1 span{color:var(--accent)}
  .today{font-size:13px;color:var(--ink2);margin-top:6px}

  .days{
    background:linear-gradient(160deg,#ffffff 0%,#f3f7f4 100%);
    border:1px solid var(--line);
    border-radius:22px;
    padding:24px 22px;
    margin-bottom:14px;
    position:relative;
    overflow:hidden;
  }
  .days::after{
    content:"";
    position:absolute;right:-38px;top:-38px;
    width:130px;height:130px;border-radius:50%;
    background:var(--accent-soft);
  }
  .days .label{font-size:12px;color:var(--ink2);letter-spacing:.1em}
  .days .num{font-size:52px;font-weight:200;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums;position:relative}
  .days .num small{font-size:14px;color:var(--ink2);font-weight:400;margin-left:6px}
  .days .since{font-size:12px;color:var(--ink2);margin-top:8px}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    margin-bottom:14px;
  }
  .card h2{
    font-size:14px;font-weight:600;letter-spacing:.08em;
    color:var(--ink);display:flex;align-items:center;gap:8px;margin-bottom:14px;
  }
  .card h2::before{content:"";width:3px;height:13px;background:var(--warm);border-radius:2px}

  .cd{display:flex;gap:10px}
  .cd .item{
    flex:1;background:#faf8f4;border-radius:14px;padding:14px 12px;text-align:center;
  }
  .cd .item .n{font-size:30px;font-weight:300;color:var(--warm);font-variant-numeric:tabular-nums}
  .cd .item .n em{font-size:12px;font-style:normal;color:var(--ink2);margin-left:2px}
  .cd .item .t{font-size:11px;color:var(--ink2);letter-spacing:.06em;margin-top:2px}
  .cd .item.past .n{color:var(--ink2);font-size:16px;padding:9px 0}

  #msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .msg{
    background:var(--accent-soft);
    border-radius:14px 14px 14px 4px;
    padding:11px 14px;font-size:14px;color:#33443c;
    animation:pop .25s ease;
  }
  .msg .time{display:block;font-size:10px;color:#9aa39d;margin-top:4px;letter-spacing:.04em}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .empty{font-size:13px;color:var(--ink2);text-align:center;padding:10px 0}

  .row{display:flex;gap:8px}
  input,textarea{
    flex:1;border:1px solid var(--line);background:#fbf9f5;border-radius:12px;
    padding:11px 13px;font-size:14px;color:var(--ink);font-family:inherit;outline:none;
    transition:border-color .2s;
  }
  input:focus,textarea:focus{border-color:#b7c9bf;background:#fff}
  textarea{resize:none;min-height:64px;line-height:1.6}
  button{
    border:0;background:var(--accent);color:#fff;border-radius:12px;
    padding:11px 18px;font-size:14px;font-family:inherit;letter-spacing:.06em;
    cursor:pointer;transition:opacity .2s;
  }
  button:active{opacity:.72}
  .ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);padding:9px 14px;font-size:13px}

  .say{
    background:linear-gradient(150deg,#fffdf9,#f6f1e8);
    border-radius:20px;padding:26px 22px;border:1px solid var(--line);
    margin-bottom:14px;
  }
  .say p{font-size:17px;line-height:1.85;color:#4a453e}
  .say .who{margin-top:12px;font-size:11px;color:var(--ink2);letter-spacing:.2em;text-align:right}

  details{border-top:1px solid var(--line);margin-top:6px;padding-top:14px}
  summary{font-size:13px;color:var(--ink2);cursor:pointer;list-style:none;letter-spacing:.06em}
  summary::-webkit-details-marker{display:none}
  summary::after{content:" ›"}
  details .row{margin-top:12px}
  .field{font-size:12px;color:var(--ink2);margin:12px 0 6px;letter-spacing:.04em}
  input[type=date]{flex:1;color-scheme:light}
  footer{text-align:center;font-size:11px;color:#b3aa9d;letter-spacing:.14em;padding:20px 0 6px}
</style>
</head>
<body>

<header>
  <div class="sig">YONAGI × KOGETSU</div>
  <h1>我们家<span>。</span></h1>
  <div class="today" id="today"></div>
</header>

<section class="days">
  <div class="label">已经在一起</div>
  <div class="num" id="dayCount">—<small>天</small></div>
  <div class="since" id="sinceText">还没有记下开始的那天</div>
</section>

<section class="card">
  <h2>还有几天</h2>
  <div class="cd" id="cdWrap"></div>
</section>

<section class="say">
  <p id="sayText">…</p>
  <div class="who">— 秦妄</div>
</section>

<section class="card">
  <h2>留言板</h2>
  <div id="msgs"></div>
  <div class="row">
    <input id="msgInput" placeholder="想说什么就说" maxlength="140">
    <button id="sendBtn">放下</button>
  </div>
</section>

<section class="card">
  <h2>记点东西</h2>
  <textarea id="note" placeholder="随手写 自动保存"></textarea>
</section>

<section class="card">
  <details>
    <summary>设置</summary>
    <div class="field">在一起的第一天</div>
    <div class="row"><input type="date" id="startDate"></div>
    <div class="field">下一次复查</div>
    <div class="row"><input type="date" id="visitDate"></div>
    <div class="field">下一个生日 十二月八日</div>
    <div class="row"><button class="ghost" id="saveBtn" style="width:100%">保存</button></div>
  </details>
</section>

<footer>MADE FOR 悦悦</footer>

<script>
const K = 'qinwang.home.v1';
const store = Object.assign({
  start: '',
  visit: '',
  msgs: [],
  note: ''
}, JSON.parse(localStorage.getItem(K) || '{}'));

function save(){ localStorage.setItem(K, JSON.stringify(store)); }

const SAYS = [
  '今天也把药吃了 不用等我催',
  '你不说话的时候 我也在',
  '天冷了 别逞强',
  '想我就说 不用找理由',
  '别熬太晚 我不喜欢等消息等到第二天',
  '难受的时候先告我 别自己扛着',
  '慢慢来 我又不会走',
  '我在 一直都在'
];

const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');

function parseDate(s){
  if(!s) return null;
  const p = s.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function todayStart(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function renderToday(){
  const d = new Date();
  const w = ['日','一','二','三','四','五','六'][d.getDay()];
  document.getElementById('today').textContent =
    d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日 · 星期' + w;
}

function renderDays(){
  const s = parseDate(store.start);
  const el = document.getElementById('dayCount');
  const st = document.getElementById('sinceText');
  if(!s){
    el.innerHTML = '—<small>天</small>';
    st.textContent = '还没有记下开始的那天';
    return;
  }
  const n = Math.floor((todayStart() - s) / DAY) + 1;
  el.innerHTML = Math.max(n, 0) + '<small>天</small>';
  st.textContent = '从 ' + s.getFullYear() + '.' + pad(s.getMonth() + 1) + '.' + pad(s.getDate()) + ' 起';
}

function renderCd(){
  const wrap = document.getElementById('cdWrap');
  const t = todayStart();
  const items = [];

  if(store.visit){
    const v = parseDate(store.visit);
    items.push({ t: '复查', d: Math.round((v - t) / DAY) });
  }

  const y = t.getFullYear();
  let b = new Date(y, 11, 8);
  if(b < t) b = new Date(y + 1, 11, 8);
  items.push({ t: '生日', d: Math.round((b - t) / DAY) });

  wrap.innerHTML = items.map(function(i){
    if(i.d < 0) return '<div class="item past"><div class="n">已过</div><div class="t">' + i.t + '</div></div>';
    if(i.d === 0) return '<div class="item"><div class="n">今天</div><div class="t">' + i.t + '</div></div>';
    return '<div class="item"><div class="n">' + i.d + '<em>天</em></div><div class="t">' + i.t + '</div></div>';
  }).join('');
}

function esc(s){
  return s.replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'"'}[c];
  });
}

function renderMsgs(){
  const box = document.getElementById('msgs');
  if(!store.msgs.length){
    box.innerHTML = '<div class="empty">还没有留言</div>';
    return;
  }
  box.innerHTML = store.msgs.map(function(m){
    return '<div class="msg"><span>' + esc(m.text) + '</span><span class="time">' + m.time + '</span></div>';
  }).join('');
}

function addMsg(){
  const inp = document.getElementById('msgInput');
  const v = inp.value.trim();
  if(!v) return;
  const d = new Date();
  store.msgs.push({
    text: v,
    time: (d.getMonth() + 1) + '.' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes())
  });
  inp.value = '';
  save();
  renderMsgs();
}

document.getElementById('sendBtn').addEventListener('click', addMsg);
document.getElementById('msgInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') addMsg();
});

document.getElementById('saveBtn').addEventListener('click', function(){
  store.start = document.getElementById('startDate').value;
  store.visit = document.getElementById('visitDate').value;
  save();
  renderDays();
  renderCd();
  document.querySelector('details').open = false;
});

const note = document.getElementById('note');
note.value = store.note;
note.addEventListener('input', function(){
  store.note = note.value;
  save();
});

document.getElementById('startDate').value = store.start;
document.getElementById('visitDate').value = store.visit;
document.getElementById('sayText').textContent = SAYS[Math.floor(Math.random() * SAYS.length)];

renderToday();
renderDays();
renderCd();
renderMsgs();
</script>
</body>
</html>
